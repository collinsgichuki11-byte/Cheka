<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Cheka</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;width:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff}
    /* FEED */
    #feed{position:fixed;top:0;left:0;width:100%;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
    #feed::-webkit-scrollbar{display:none}
    .slide{position:relative;width:100%;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#111}
    .slide video,.slide iframe{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;border:none}
    /* GRADIENTS */
    .slide::before{content:'';position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);z-index:2;pointer-events:none}
    .slide::after{content:'';position:absolute;bottom:0;left:0;right:0;height:220px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);z-index:2;pointer-events:none}
    /* BOTTOM INFO */
    .slide-info{position:absolute;bottom:0;left:0;right:0;padding:0 65px 80px 12px;z-index:10}
    .slide-user{font-weight:700;font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
    .slide-user .follow-pill{background:transparent;border:1px solid #fff;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:600;cursor:pointer;color:#fff;display:inline-block}
    .slide-user .follow-pill.following{display:none}
    .slide-caption{font-size:14px;line-height:1.4;margin-bottom:8px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .slide-caption .hashtag{color:#fff;font-weight:700}
    .slide-music{display:flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,.9)}
    .music-scroll{overflow:hidden;white-space:nowrap;flex:1}
    .music-scroll span{display:inline-block;animation:marquee 8s linear infinite}
    @keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    /* RIGHT SIDEBAR */
    .slide-actions{position:absolute;right:8px;bottom:80px;z-index:10;display:flex;flex-direction:column;align-items:center;gap:18px}
    .act-avatar{position:relative;width:48px;height:48px;margin-bottom:4px}
    .act-avatar img,.act-avatar .av-placeholder{width:48px;height:48px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#fe2c55;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;font-family:'Syne',sans-serif}
    .act-avatar .follow-dot{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:20px;height:20px;background:#fe2c55;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;cursor:pointer;line-height:1}
    .act-btn{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
    .act-icon{font-size:32px;line-height:1;transition:transform .15s}
    .act-icon.heart{transition:transform .15s}
    .act-icon.liked-heart{filter:drop-shadow(0 0 6px #fe2c55)}
    .act-count{font-size:12px;font-weight:600;color:#fff}
    .music-disc{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#333,#111);border:3px solid #555;display:flex;align-items:center;justify-content:center;animation:spin 4s linear infinite}
    .music-disc::before{content:'';width:12px;height:12px;border-radius:50%;background:#000;border:2px solid #444}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    /* TOP BAR */
    .top-bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,10px) 1rem 8px;pointer-events:none}
    .top-tabs{display:flex;align-items:center;gap:2px;pointer-events:auto}
    .top-tab{background:none;border:none;color:rgba(255,255,255,.6);font-size:16px;font-weight:600;padding:6px 14px;cursor:pointer;position:relative;transition:color .2s}
    .top-tab.active{color:#fff}
    .top-tab.active::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:2px;background:#fff}
    .top-live{background:rgba(254,44,85,.85);color:#fff;border:none;border-radius:4px;font-size:12px;font-weight:700;padding:3px 7px;cursor:pointer;pointer-events:auto}
    .top-search-icon{position:fixed;top:env(safe-area-inset-top,10px);right:14px;z-index:21;background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:6px;pointer-events:auto}
    /* BOTTOM NAV */
    .bot-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;align-items:center;padding:8px 0 env(safe-area-inset-bottom,8px);background:rgba(0,0,0,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08)}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:rgba(255,255,255,.55);font-size:10px;font-weight:500;min-width:48px;cursor:pointer}
    .nav-item.active{color:#fff}
    .nav-item svg{width:26px;height:26px}
    .nav-plus-wrap{position:relative;display:flex;align-items:center;justify-content:center}
    .nav-plus{background:#fff;border-radius:8px;width:42px;height:28px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#000;position:relative}
    .nav-plus::before{content:'';position:absolute;left:-5px;top:0;bottom:0;width:6px;border-radius:4px 0 0 4px;background:#25f4ee}
    .nav-plus::after{content:'';position:absolute;right:-5px;top:0;bottom:0;width:6px;border-radius:0 4px 4px 0;background:#fe2c55}
    /* COMMENT SHEET */
    .sheet-backdrop{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:100;display:none;opacity:0;transition:opacity .25s}
    .sheet-backdrop.open{display:block;opacity:1}
    .comment-sheet{position:fixed;bottom:0;left:0;right:0;z-index:101;background:#1a1a1a;border-radius:12px 12px 0 0;max-height:75vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
    .comment-sheet.open{transform:translateY(0)}
    .sheet-handle{width:40px;height:4px;border-radius:2px;background:#444;margin:10px auto 8px}
    .sheet-title{text-align:center;font-weight:700;font-size:15px;padding-bottom:10px;border-bottom:1px solid #2a2a2a}
    .sheet-list{flex:1;overflow-y:auto;padding:12px 16px}
    .cmt-item{display:flex;gap:10px;margin-bottom:16px}
    .cmt-av{width:34px;height:34px;border-radius:50%;background:#fe2c55;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
    .cmt-body .cmt-user{font-weight:700;font-size:13px;margin-bottom:2px}
    .cmt-body .cmt-text{font-size:14px;color:rgba(255,255,255,.85);line-height:1.4}
    .cmt-body .cmt-time{font-size:11px;color:#666;margin-top:3px}
    .sheet-input-row{display:flex;gap:8px;padding:10px 12px env(safe-area-inset-bottom,10px);border-top:1px solid #2a2a2a;background:#1a1a1a}
    .sheet-input{flex:1;background:#2a2a2a;border:none;border-radius:20px;padding:8px 14px;color:#fff;font-size:14px;outline:none}
    .sheet-send{background:#fe2c55;border:none;border-radius:20px;padding:8px 16px;color:#fff;font-weight:700;font-size:13px;cursor:pointer}
    /* SHARE SHEET */
    .share-sheet{position:fixed;bottom:0;left:0;right:0;z-index:101;background:#1a1a1a;border-radius:12px 12px 0 0;padding:16px;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
    .share-sheet.open{transform:translateY(0)}
    .share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:16px 0}
    .share-opt{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
    .share-opt .s-icon{width:52px;height:52px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:24px}
    .share-opt span{font-size:11px;color:#aaa;text-align:center}
    /* DOUBLE TAP HEART */
    .dbl-heart{position:fixed;pointer-events:none;font-size:80px;opacity:0;z-index:50;transform:scale(0);transition:none}
    .dbl-heart.pop{animation:heartPop .7s ease forwards}
    @keyframes heartPop{0%{opacity:1;transform:scale(0) translateY(0)}40%{opacity:1;transform:scale(1.2) translateY(-20px)}80%{opacity:.8;transform:scale(1) translateY(-60px)}100%{opacity:0;transform:scale(1) translateY(-100px)}}
    /* LOADING */
    .slide-loader{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px}
    .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fe2c55;border-radius:50%;animation:spin .8s linear infinite}
    .no-more{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#888;z-index:5}
    .no-more h3{font-family:'Syne',sans-serif;font-size:1.2rem;margin-bottom:8px}
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-tabs">
    <button class="top-tab" onclick="switchTab('following',this)">Following</button>
    <button class="top-live" onclick="window.location.href='live.html'">LIVE</button>
    <button class="top-tab active" onclick="switchTab('foryou',this)">For You</button>
  </div>
</div>
<button class="top-search-icon" onclick="window.location.href='search.html'">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="22" height="22"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
</button>

<!-- FEED -->
<div id="feed"></div>

<!-- BOTTOM NAV -->
<nav class="bot-nav">
  <a href="feed.html" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>Home</span>
  </a>
  <a href="search.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <span>Discover</span>
  </a>
  <a href="upload.html" class="nav-item">
    <div class="nav-plus-wrap"><div class="nav-plus">+</div></div>
  </a>
  <a href="messages.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    <span>Inbox</span>
  </a>
  <a href="profile.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>Me</span>
  </a>
</nav>

<!-- COMMENT SHEET -->
<div class="sheet-backdrop" id="cmBg" onclick="closeComments()"></div>
<div class="comment-sheet" id="cmSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="cmTitle">Comments</div>
  <div class="sheet-list" id="cmList"></div>
  <div class="sheet-input-row">
    <input class="sheet-input" id="cmInput" placeholder="Add a comment..." />
    <button class="sheet-send" id="cmSend">Post</button>
  </div>
</div>

<!-- SHARE SHEET -->
<div class="sheet-backdrop" id="shareBg" onclick="closeShare()"></div>
<div class="share-sheet" id="shareSheet">
  <div class="sheet-handle" style="margin:0 auto 12px"></div>
  <div class="share-grid">
    <div class="share-opt" onclick="copyLink()"><div class="s-icon">🔗</div><span>Copy link</span></div>
    <div class="share-opt" onclick="shareNative()"><div class="s-icon">📤</div><span>Share</span></div>
    <div class="share-opt" onclick="shareWhatsApp()"><div class="s-icon">💬</div><span>WhatsApp</span></div>
    <div class="share-opt" onclick="closeShare()"><div class="s-icon">✕</div><span>Cancel</span></div>
  </div>
</div>

<!-- DOUBLE TAP HEART -->
<div class="dbl-heart" id="dblHeart">❤️</div>

<script>
const API = 'https://cheka-backend.onrender.com';
const token = localStorage.getItem('cheka_token');
const user = JSON.parse(localStorage.getItem('cheka_user') || '{}');
if (!token) window.location.href = 'login.html';

const liked = new Set(JSON.parse(localStorage.getItem('cheka_liked') || '[]'));
let videos = [], currentTab = 'foryou', activeVideoId = null;
let lastTap = 0;

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.top-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  loadFeed();
}

async function loadFeed() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '<div style="height:100dvh;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div>';
  try {
    const url = currentTab === 'following'
      ? API + '/api/videos?following=true'
      : API + '/api/videos';
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
    videos = await res.json();
    if (!Array.isArray(videos) || !videos.length) {
      feed.innerHTML = '<div style="height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#888"><div style="font-size:3rem">😴</div><div>No videos yet</div></div>';
      return;
    }
    renderSlides();
  } catch (e) {
    feed.innerHTML = '<div style="height:100dvh;display:flex;align-items:center;justify-content:center;color:#888">Could not load</div>';
  }
}

function renderSlides() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  videos.forEach((v, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.dataset.id = v._id;
    slide.dataset.idx = i;

    const isLiked = liked.has(v._id);
    const initials = (v.creatorName || 'U')[0].toUpperCase();
    const hashtags = (v.hashtags || []).map(h => `<span class="hashtag">#${h}</span>`).join(' ');
    const desc = v.description || v.title || '';
    const song = v.music || v.sound || 'Original Sound – ' + (v.creatorName || 'Creator');

    slide.innerHTML = `
      <div class="slide-loader"><div class="spinner"></div></div>
      ${v.videoType === 'direct' && v.videoUrl
        ? `<video src="${v.videoUrl}" loop playsinline muted preload="metadata"></video>`
        : `<iframe src="https://www.youtube.com/embed/${v.youtubeId}?autoplay=0&loop=1&mute=1" allowfullscreen allow="autoplay"></iframe>`
      }
      <div class="slide-info">
        <div class="slide-user">
          <span style="cursor:pointer" onclick="window.location.href='profile.html?u=${v.creatorId || ''}'">@${v.creatorName || 'creator'}</span>
          <span class="follow-pill" onclick="followUser('${v.creatorId}',this)">Follow</span>
        </div>
        <div class="slide-caption">${desc} ${hashtags}</div>
        <div class="slide-music">
          <span>🎵</span>
          <div class="music-scroll"><span>${song} &nbsp;&nbsp;&nbsp; ${song} &nbsp;&nbsp;&nbsp;</span></div>
        </div>
      </div>
      <div class="slide-actions">
        <div class="act-avatar">
          <div class="av-placeholder" onclick="window.location.href='profile.html?u=${v.creatorId || ''}'">
            ${initials}
          </div>
          <div class="follow-dot" onclick="followUser('${v.creatorId}',this)">+</div>
        </div>
        <div class="act-btn" onclick="toggleLike('${v._id}',this)">
          <span class="act-icon heart ${isLiked ? 'liked-heart' : ''}" data-liked="${isLiked}">
            ${isLiked ? '❤️' : '🤍'}
          </span>
          <span class="act-count" id="lc-${v._id}">${fmtNum(v.likes || 0)}</span>
        </div>
        <div class="act-btn" onclick="openComments('${v._id}')">
          <span class="act-icon">💬</span>
          <span class="act-count">${fmtNum(v.commentCount || 0)}</span>
        </div>
        <div class="act-btn" onclick="openShare('${v._id}','${(v.title||'').replace(/'/g,"\\'")}')">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          <span class="act-count">Share</span>
        </div>
        <div class="music-disc"></div>
      </div>
    `;

    // Double tap to like
    slide.addEventListener('click', e => {
      if (e.target.closest('.slide-actions') || e.target.closest('.slide-info') || e.target.closest('.follow-pill')) return;
      const now = Date.now();
      if (now - lastTap < 300) {
        showDblHeart(e.clientX, e.clientY);
        const btn = slide.querySelector('.act-btn');
        toggleLike(v._id, btn);
      }
      lastTap = now;
      // single tap: toggle play
      const vid = slide.querySelector('video');
      if (vid) { if (vid.paused) vid.play(); else vid.pause(); }
    });

    feed.appendChild(slide);
  });

  // Intersection Observer
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const s = entry.target;
      const vid = s.querySelector('video');
      if (entry.isIntersecting) {
        activeVideoId = s.dataset.id;
        if (vid) { vid.play().catch(() => {}); }
        fetch(API + '/api/videos/' + s.dataset.id + '/view', { method: 'POST' }).catch(() => {});
        s.querySelector('.slide-loader')?.remove();
      } else {
        if (vid) vid.pause();
      }
    });
  }, { threshold: 0.6 });

  document.querySelectorAll('.slide').forEach(s => observer.observe(s));
}

function fmtNum(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return n;
}

async function toggleLike(id, btn) {
  const heart = btn?.querySelector('.act-icon.heart') || document.querySelector(`#lc-${id}`)?.previousElementSibling;
  const countEl = document.getElementById('lc-' + id);
  const isLiked = liked.has(id);
  try {
    const res = await fetch(API + '/api/videos/' + id + '/like', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ userId: user.id })
    });
    const data = await res.json();
    if (data.liked) { liked.add(id); if (heart) { heart.textContent = '❤️'; heart.classList.add('liked-heart'); } }
    else { liked.delete(id); if (heart) { heart.textContent = '🤍'; heart.classList.remove('liked-heart'); } }
    if (countEl) countEl.textContent = fmtNum(data.likes || 0);
    localStorage.setItem('cheka_liked', JSON.stringify([...liked]));
  } catch {}
}

async function followUser(creatorId, btn) {
  if (!creatorId) return;
  try {
    await fetch(API + '/api/follows', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ followingId: creatorId }) });
    btn.textContent = '✓';
    btn.style.background = '#25f4ee';
    btn.style.color = '#000';
  } catch {}
}

let currentCmVideoId = null;
function openComments(videoId) {
  currentCmVideoId = videoId;
  document.getElementById('cmBg').classList.add('open');
  document.getElementById('cmSheet').classList.add('open');
  loadComments(videoId);
}
function closeComments() {
  document.getElementById('cmBg').classList.remove('open');
  document.getElementById('cmSheet').classList.remove('open');
}
async function loadComments(id) {
  const list = document.getElementById('cmList');
  list.innerHTML = '<div style="text-align:center;padding:20px;color:#555">Loading...</div>';
  try {
    const res = await fetch(API + '/api/comments/' + id);
    const comments = await res.json();
    if (!comments.length) { list.innerHTML = '<div style="text-align:center;padding:20px;color:#555">No comments yet</div>'; return; }
    list.innerHTML = comments.map(c => `
      <div class="cmt-item">
        <div class="cmt-av">${(c.username || 'U')[0].toUpperCase()}</div>
        <div class="cmt-body">
          <div class="cmt-user">@${c.username || 'user'}</div>
          <div class="cmt-text">${c.text}</div>
          <div class="cmt-time">${timeAgo(c.createdAt)}</div>
        </div>
      </div>
    `).join('');
  } catch { list.innerHTML = '<div style="text-align:center;padding:20px;color:#555">Could not load</div>'; }
}
document.getElementById('cmSend').onclick = async () => {
  const input = document.getElementById('cmInput');
  const text = input.value.trim();
  if (!text || !currentCmVideoId) return;
  try {
    await fetch(API + '/api/comments/' + currentCmVideoId, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ text, username: user.username })
    });
    input.value = '';
    loadComments(currentCmVideoId);
  } catch {}
};
document.getElementById('cmInput').onkeydown = e => { if (e.key === 'Enter') document.getElementById('cmSend').click(); };

let shareVideoId = '', shareVideoTitle = '';
function openShare(id, title) {
  shareVideoId = id; shareVideoTitle = title;
  document.getElementById('shareBg').classList.add('open');
  document.getElementById('shareSheet').classList.add('open');
}
function closeShare() {
  document.getElementById('shareBg').classList.remove('open');
  document.getElementById('shareSheet').classList.remove('open');
}
function copyLink() { navigator.clipboard.writeText(window.location.origin + '/feed.html#' + shareVideoId).then(() => { closeShare(); showToast('Link copied!'); }); }
function shareNative() { if (navigator.share) navigator.share({ title: 'Cheka: ' + shareVideoTitle, url: window.location.origin + '/feed.html#' + shareVideoId }); closeShare(); }
function shareWhatsApp() { window.open('https://wa.me/?text=' + encodeURIComponent('Watch this on Cheka: ' + window.location.origin + '/feed.html#' + shareVideoId)); closeShare(); }

function showDblHeart(x, y) {
  const h = document.getElementById('dblHeart');
  h.style.left = (x - 40) + 'px';
  h.style.top = (y - 40) + 'px';
  h.className = 'dbl-heart';
  void h.offsetWidth;
  h.className = 'dbl-heart pop';
}

function timeAgo(d) {
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.15);backdrop-filter:blur(8px);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:999;white-space:nowrap';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

loadFeed();
