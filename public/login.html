<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Cheka</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&display=swap" rel="stylesheet"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#fe2c55"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100%}
    .page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,0) 24px env(safe-area-inset-bottom,0)}
    .logo-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 0 20px}
    .logo{font-family:'Syne',sans-serif;font-size:3rem;font-weight:900;margin-bottom:8px;text-align:center}
    .logo-sub{font-size:14px;color:#888;text-align:center}
    .form-area{width:100%;max-width:400px;padding-bottom:32px}
    .form-title{font-family:'Syne',sans-serif;font-size:24px;font-weight:900;margin-bottom:6px;text-align:center}
    .form-sub{font-size:13px;color:#888;text-align:center;margin-bottom:24px}
    .field{width:100%;background:#1c1c1e;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;color:#fff;font-size:15px;outline:none;margin-bottom:12px;transition:border-color .2s}
    .field:focus{border-color:#fe2c55}
    .field::placeholder{color:#555}
    .submit-btn{width:100%;background:#fe2c55;border:none;border-radius:10px;padding:15px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px;transition:opacity .2s;font-family:'Syne',sans-serif}
    .submit-btn:disabled{opacity:.5;cursor:not-allowed}
    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#444;font-size:12px}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:#222}
    .alt-btn{width:100%;background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:border-color .2s}
    .alt-btn:hover{border-color:rgba(255,255,255,.4)}
    .switch-link{text-align:center;margin-top:20px;font-size:13px;color:#888}
    .switch-link a{color:#fe2c55;text-decoration:none;font-weight:600}
    .error-box{background:rgba(254,44,85,.1);border:1px solid rgba(254,44,85,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#fe2c55;margin-bottom:12px;display:none}
    .error-box.show{display:block}
    .success-box{background:rgba(29,185,84,.1);border:1px solid rgba(29,185,84,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#1db954;margin-bottom:12px;display:none}
    .success-box.show{display:block}
  </style>
</head>
<body>
<div class="page">
  <div class="logo-area">
    <div class="logo">😂 Cheka</div>
    <div class="logo-sub">Kenya's #1 comedy platform</div>
  </div>
  <div class="form-area">
    <div class="form-title">Log in</div>
    <div class="form-sub">Welcome back — the laughs missed you</div>
    <div class="error-box" id="errorBox"></div>
    <div class="success-box" id="successBox"></div>
    <input class="field" id="email" type="email" placeholder="Email" autocomplete="email"/>
    <input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password"/>
    <button class="submit-btn" id="loginBtn" onclick="login()">Log in</button>
    <div class="switch-link">Don't have an account? <a href="signup.html">Sign up</a></div>
  </div>
</div>
<script>
const API = 'https://cheka-backend.onrender.com';
document.querySelectorAll('.field').forEach(f => {
  f.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
});
async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errorBox');
  const suc = document.getElementById('successBox');
  err.classList.remove('show'); suc.classList.remove('show');
  if (!email || !password) { err.textContent = 'Fill in all fields'; err.classList.add('show'); return; }
  btn.disabled = true; btn.textContent = 'Logging in...';
  try {
    const res = await fetch(API + '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.msg || 'Invalid credentials'; err.classList.add('show'); btn.disabled = false; btn.textContent = 'Log in'; return; }
    localStorage.setItem('cheka_token', data.token);
    localStorage.setItem('cheka_user', JSON.stringify(data.user));
    suc.textContent = 'Welcome back! Redirecting...'; suc.classList.add('show');
    setTimeout(() => window.location.href = 'feed.html', 1200);
  } catch { err.textContent = 'Cannot connect to server'; err.classList.add('show'); btn.disabled = false; btn.textContent = 'Log in'; }
}
if (localStorage.getItem('cheka_token')) window.location.href = 'feed.html';
</script>
</body>
</html>
