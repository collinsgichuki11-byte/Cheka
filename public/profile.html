<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Profile — Cheka</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Space+Mono&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{background:#000;color:#f5f5f5;font-family:'Space Mono',monospace;min-height:100%}
    .top-bar{background:#0a0a0a;border-bottom:1px solid #1f1f1f;display:flex;align-items:center;gap:1rem;padding:.85rem 1rem;position:sticky;top:0;z-index:100}
    .top-bar h1{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:900;flex:1}
    .edit-toggle{background:none;border:1px solid #2a2a2a;color:#f5f5f5;border-radius:8px;padding:.4rem .85rem;font-family:'Space Mono',monospace;font-size:.75rem;cursor:pointer;touch-action:manipulation}
    .page{padding:1rem;padding-bottom:5.5rem;max-width:600px;margin:0 auto}
    .profile-card{background:#111;border:1px solid #1f1f1f;border-radius:16px;padding:1.5rem;margin-bottom:1.5rem}
    .profile-top{display:flex;align-items:center;gap:1.2rem;margin-bottom:1.2rem}
    .avatar{width:72px;height:72px;border-radius:50%;background:#e63212;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:900;flex-shrink:0}
    .profile-info h2{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:900;margin-bottom:.2rem}
    .profile-info .handle{color:#888;font-size:.8rem}
    .bio-text{color:#aaa;font-size:.8rem;line-height:1.6;margin-top:.6rem}
    .link-text{color:#e63212;font-size:.8rem;margin-top:.3rem;word-break:break-all}
    .stats-row{display:flex;gap:1.5rem;padding-top:1rem;border-top:1px solid #1f1f1f;margin-top:1rem}
    .stat h3{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:900;color:#e63212}
    .stat p{color:#888;font-size:.7rem;margin-top:.1rem}
    .edit-form{display:none;margin-top:1rem;padding-top:1rem;border-top:1px solid #1f1f1f}
    .edit-form.open{display:block}
    .fg{margin-bottom:1rem}
    .fg label{display:block;font-size:.75rem;color:#888;margin-bottom:.35rem}
    .fg input,.fg textarea,.fg select{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:.65rem .9rem;color:#f5f5f5;font-family:'Space Mono',monospace;font-size:.82rem;outline:none}
    .fg input:focus,.fg textarea:focus,.fg select:focus{border-color:#e63212}
    .fg textarea{resize:vertical;min-height:70px}
    .save-btn{background:#e63212;color:#fff;border:none;border-radius:8px;padding:.75rem 1.5rem;font-family:'Space Mono',monospace;font-weight:700;cursor:pointer;width:100%;touch-action:manipulation}
    .section-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:900;margin-bottom:1rem}
    .video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem}
    .video-card{background:#111;border:1px solid #1f1f1f;border-radius:10px;overflow:hidden}
    .video-thumb{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;background:#0a0a0a}
    .video-thumb iframe,.video-thumb video{position:absolute;top:0;left:0;width:100%;height:100%;border:none;object-fit:cover}
    .video-details{padding:.6rem .75rem}
    .video-details h3{font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .video-meta{display:flex;justify-content:space-between;margin-top:.3rem;font-size:.7rem;color:#888}
    .del-btn{width:100%;background:transparent;border:1px solid #e63212;color:#e63212;border-radius:6px;padding:.4rem;font-family:'Space Mono',monospace;font-size:.7rem;cursor:pointer;margin-top:.5rem;touch-action:manipulation}
    .empty-state{text-align:center;padding:2.5rem;color:#888;grid-column:1/-1}
    .empty-state h2{font-family:'Syne',sans-serif;color:#f5f5f5;margin-bottom:.4rem;font-size:1.1rem}
    .go-upload{display:inline-block;background:#e63212;color:#fff;border-radius:8px;padding:.6rem 1.3rem;text-decoration:none;font-size:.8rem;font-weight:700;margin-top:.75rem}
    .logout-btn{width:100%;background:transparent;border:1px solid #2a2a2a;color:#888;border-radius:8px;padding:.7rem;font-family:'Space Mono',monospace;font-size:.8rem;cursor:pointer;margin-top:1rem;touch-action:manipulation}
    .bot-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;justify-content:space-around;align-items:center;padding:.6rem 1rem env(safe-area-inset-bottom,.4rem);background:#0a0a0a;border-top:1px solid #1f1f1f}
    .bot-btn{display:flex;flex-direction:column;align-items:center;gap:.2rem;text-decoration:none;color:rgba(255,255,255,.5);font-size:.55rem;touch-action:manipulation}
    .bot-btn.active{color:#f5f5f5}
    .bot-btn .bicon{font-size:1.3rem}
    .toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:#1db954;color:#000;padding:.65rem 1.4rem;border-radius:8px;font-size:.8rem;font-weight:700;display:none;z-index:9999;white-space:nowrap}
    .toast.show{display:block}
  </style>
</head>
<body>

<div class="top-bar">
  <h1>👤 Profile</h1>
  <button class="edit-toggle" id="editToggle" onclick="toggleEdit()">Edit</button>
</div>

<div class="page">
  <div class="profile-card">
    <div class="profile-top">
      <div class="avatar" id="avatar">?</div>
      <div class="profile-info">
        <h2 id="profileName">Loading...</h2>
        <div class="handle" id="profileHandle"></div>
        <div class="bio-text" id="bioText"></div>
        <div class="link-text" id="linkText"></div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat"><h3 id="totalVideos">0</h3><p>Videos</p></div>
      <div class="stat"><h3 id="totalLikes">0</h3><p>Likes</p></div>
      <div class="stat"><h3 id="totalFollowers">0</h3><p>Followers</p></div>
    </div>

    <div class="edit-form" id="editForm">
      <div class="fg">
        <label>Display Name</label>
        <input type="text" id="editDisplayName" maxlength="40" placeholder="Your name"/>
      </div>
      <div class="fg">
        <label>Bio (max 160 chars)</label>
        <textarea id="editBio" maxlength="160" placeholder="Tell the world who you are..."></textarea>
      </div>
      <div class="fg">
        <label>Link in bio</label>
        <input type="text" id="editLink" maxlength="200" placeholder="https://..."/>
      </div>
      <div class="fg">
        <label>Who can comment on your videos</label>
        <select id="editWhoCanComment">
          <option value="everyone">Everyone</option>
          <option value="followers">Followers only</option>
          <option value="noone">No one</option>
        </select>
      </div>
      <div class="fg">
        <label>Who can message you</label>
        <select id="editWhoCanMessage">
          <option value="everyone">Everyone</option>
          <option value="followers">Followers only</option>
          <option value="noone">No one</option>
        </select>
      </div>
      <button class="save-btn" onclick="saveProfile()">💾 Save Changes</button>
    </div>

    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </div>

  <div class="section-title">My Videos 🎬</div>
  <div id="myVideos" class="video-grid">
    <div class="empty-state"><p>Loading...</p></div>
  </div>
</div>

<div class="bot-bar">
  <a href="index.html" class="bot-btn"><span class="bicon">🏠</span><span>Home</span></a>
  <a href="feed.html" class="bot-btn"><span class="bicon">😂</span><span>Watch</span></a>
  <a href="upload.html" class="bot-btn"><span class="bicon">➕</span><span>Upload</span></a>
  <a href="messages.html" class="bot-btn"><span class="bicon">💬</span><span>DMs</span></a>
  <a href="profile.html" class="bot-btn active"><span class="bicon">👤</span><span>Me</span></a>
</div>

<div class="toast" id="toast"></div>

<script>
const API='https://cheka-backend.onrender.com';
const token=localStorage.getItem('cheka_token');
let user=JSON.parse(localStorage.getItem('cheka_user')||'{}');
if(!token)window.location.href='login.html';

function toast(msg,green=true){
  const t=document.getElementById('toast');
  t.style.background=green?'#1db954':'#e63212';
  t.style.color=green?'#000':'#fff';
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function toggleEdit(){
  const f=document.getElementById('editForm');
  const open=f.classList.toggle('open');
  document.getElementById('editToggle').textContent=open?'Cancel':'Edit';
  if(open)loadFullProfile();
}

async function loadFullProfile(){
  try{
    const res=await fetch(API+'/api/users/me',{headers:{'Authorization':'Bearer '+token}});
    const u=await res.json();
    document.getElementById('editDisplayName').value=u.displayName||'';
    document.getElementById('editBio').value=u.bio||'';
    document.getElementById('editLink').value=u.link||'';
    document.getElementById('editWhoCanComment').value=u.whoCanComment||'everyone';
    document.getElementById('editWhoCanMessage').value=u.whoCanMessage||'everyone';
    document.getElementById('bioText').textContent=u.bio||'';
    document.getElementById('linkText').textContent=u.link||'';
  }catch{}
}

async function saveProfile(){
  const displayName=document.getElementById('editDisplayName').value.trim();
  const bio=document.getElementById('editBio').value.trim();
  const link=document.getElementById('editLink').value.trim();
  const whoCanComment=document.getElementById('editWhoCanComment').value;
  const whoCanMessage=document.getElementById('editWhoCanMessage').value;
  try{
    const res=await fetch(API+'/api/users/me',{
      method:'PATCH',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({displayName,bio,link,whoCanComment,whoCanMessage})
    });
    const u=await res.json();
    if(!res.ok){toast(u.msg||'Could not save',false);return;}
    toast('Profile updated! ✅');
    document.getElementById('profileName').textContent=u.displayName||('@'+u.username);
    document.getElementById('bioText').textContent=u.bio||'';
    document.getElementById('linkText').textContent=u.link||'';
    toggleEdit();
  }catch{toast('Network error',false);}
}

async function deleteVideo(id){
  if(!confirm('Delete this video?'))return;
  try{
    const res=await fetch(API+'/api/videos/'+id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});
    if(res.ok){toast('Video deleted');loadMyVideos();}
    else toast('Could not delete',false);
  }catch{toast('Network error',false);}
}

async function loadMyVideos(){
  try{
    const res=await fetch(API+'/api/videos',{headers:{'Authorization':'Bearer '+token}});
    const all=await res.json();
    const mine=all.filter(v=>v.creatorName===user.username);

    document.getElementById('avatar').textContent=user.username?user.username[0].toUpperCase():'?';
    document.getElementById('profileName').textContent=user.displayName||('@'+user.username);
    document.getElementById('profileHandle').textContent='@'+user.username;
    document.getElementById('totalVideos').textContent=mine.length;
    document.getElementById('totalLikes').textContent=mine.reduce((s,v)=>s+(v.likes||0),0);

    try{
      const fr=await fetch(API+'/api/follows/'+user.id+'/count');
      const fd=await fr.json();
      document.getElementById('totalFollowers').textContent=fd.followers||fd.count||0;
    }catch{}

    const grid=document.getElementById('myVideos');
    if(!mine.length){
      grid.innerHTML=`<div class="empty-state"><h2>No videos yet 😅</h2><p>Upload your first funny video!</p><a href="upload.html" class="go-upload">Upload Now</a></div>`;
      return;
    }
    grid.innerHTML=mine.map(v=>`
      <div class="video-card" id="vc-${v._id}">
        <div class="video-thumb">
          ${v.videoType==='direct'&&v.videoUrl
            ?`<video src="${v.videoUrl}" muted playsinline></video>`
            :`<iframe src="https://www.youtube.com/embed/${v.youtubeId}" allowfullscreen loading="lazy"></iframe>`}
        </div>
        <div class="video-details">
          <h3>${v.title}</h3>
          <div class="video-meta"><span>${new Date(v.createdAt).toLocaleDateString()}</span><span>❤️ ${v.likes||0}</span></div>
          <button class="del-btn" onclick="deleteVideo('${v._id}')">🗑 Delete</button>
        </div>
      </div>
    `).join('');
  }catch{
    document.getElementById('myVideos').innerHTML='<div class="empty-state"><p>Could not load videos</p></div>';
  }
}

function logout(){
  localStorage.removeItem('cheka_token');
  localStorage.removeItem('cheka_user');
  window.location.href='index.html';
}

loadMyVideos();
loadFullProfile();
</script>
</body>
</html>
