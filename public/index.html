<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cheka</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&display=swap" rel="stylesheet"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#fe2c55"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="Cheka"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100%}
    .splash{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;gap:12px}
    .splash-logo{font-family:'Syne',sans-serif;font-size:4rem;font-weight:900;background:linear-gradient(135deg,#fe2c55,#ff6b35);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .splash-sub{font-size:14px;color:#888}
    .spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.15);border-top-color:#fe2c55;border-radius:50%;animation:spin .8s linear infinite;margin-top:24px}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="splash">
  <div class="splash-logo">😂 Cheka</div>
  <div class="splash-sub">Kenya's #1 comedy platform</div>
  <div class="spinner"></div>
</div>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
const token=localStorage.getItem('cheka_token');
setTimeout(()=>{
  if(token) window.location.replace('feed.html');
  else window.location.replace('login.html');
},800);
</script>
</body>
</html>
