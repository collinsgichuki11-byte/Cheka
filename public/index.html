<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cheka — Kenya's #1 Comedy Platform</title>
  <meta name="description" content="Watch skits, compete in daily battles, go live — join Kenya's funniest platform."/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#fe2c55"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="Cheka"/>
  <meta property="og:title" content="Cheka — Kenya's #1 Comedy Platform"/>
  <meta property="og:description" content="Watch skits, compete in daily battles, go live — join Kenya's funniest platform."/>
  <meta property="og:type" content="website"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100%}
    .splash{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000}
    .logo{font-family:'Syne',sans-serif;font-size:4rem;font-weight:900;background:linear-gradient(135deg,#fe2c55,#ff6b35);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
    .tagline{font-size:14px;color:#666;margin-bottom:32px}
    .spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.1);border-top-color:#fe2c55;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="splash">
  <div class="logo">😂 Cheka</div>
  <div class="tagline">Kenya's #1 Comedy Platform</div>
  <div class="spinner"></div>
</div>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
const token = localStorage.getItem('cheka_token');
const onboarded = localStorage.getItem('cheka_onboarded');
setTimeout(() => {
  if (token && onboarded) window.location.replace('feed.html');
  else if (token && !onboarded) window.location.replace('onboarding.html');
  else window.location.replace('landing.html');
}, 800);
</script>
</body>
</html>
