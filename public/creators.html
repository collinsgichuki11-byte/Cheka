<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Creators — Cheka</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100%;padding-bottom:80px}
    .top-bar{display:flex;align-items:center;gap:10px;padding:env(safe-area-inset-top,10px) 16px 10px;border-bottom:1px solid rgba(255,255,255,.08);background:#000;position:sticky;top:0;z-index:10}
    .top-back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
    .top-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:900;flex:1}
    .creator-card{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
    .creator-av{width:52px;height:52px;border-radius:50%;background:#fe2c55;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;font-family:'Syne',sans-serif;flex-shrink:0}
    .creator-info{flex:1;min-width:0}
    .creator-info h3{font-size:14px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .creator-info p{font-size:12px;color:#888}
    .follow-btn{background:transparent;border:1px solid #fe2c55;color:#fe2c55;border-radius:4px;padding:6px 16px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;white-space:nowrap}
    .follow-btn.following{background:#fe2c55;color:#fff}
    .section-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:900;padding:16px 16px 10px}
    .empty{text-align:center;padding:48px;color:#555}
    .bot-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;align-items:center;padding:8px 0 env(safe-area-inset-bottom,8px);background:rgba(0,0,0,.95);border-top:1px solid rgba(255,255,255,.08)}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:rgba(255,255,255,.55);font-size:10px;min-width:48px}
    .nav-item.active{color:#fff}
    .nav-item svg{width:26px;height:26px}
    .nav-plus-wrap{display:flex;align-items:center}
    .nav-plus{background:#fff;border-radius:8px;width:42px;height:28px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#000;position:relative}
    .nav-plus::before{content:'';position:absolute;left:-5px;top:0;bottom:0;width:6px;border-radius:4px 0 0 4px;background:#25f4ee}
    .nav-plus::after{content:'';position:absolute;right:-5px;top:0;bottom:0;width:6px;border-radius:0 4px 4px 0;background:#fe2c55}
  </style>
</head>
<body>
<div class="top-bar">
  <button class="top-back" onclick="history.back()">‹</button>
  <span class="top-title">Top Creators</span>
</div>
<div class="section-title">🌟 Trending Creators</div>
<div id="creatorList"><div style="padding:40px;text-align:center;color:#555">Loading...</div></div>
<nav class="bot-nav">
  <a href="feed.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span>
  </a>
  <a href="search.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><span>Discover</span>
  </a>
  <a href="upload.html" class="nav-item"><div class="nav-plus-wrap"><div class="nav-plus">+</div></div></a>
  <a href="messages.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><span>Inbox</span>
  </a>
  <a href="profile.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Me</span>
  </a>
</nav>
<script>
const API='https://cheka-backend.onrender.com';
const token=localStorage.getItem('cheka_token');
const user=JSON.parse(localStorage.getItem('cheka_user')||'{}');
if(!token)window.location.href='login.html';
const followed=new Set(JSON.parse(localStorage.getItem('cheka_following')||'[]'));
async function load(){
  try{
    const res=await fetch(API+'/api/users/creators',{headers:{Authorization:'Bearer '+token}});
    const creators=await res.json();
    if(!creators.length){document.getElementById('creatorList').innerHTML='<div class="empty">No creators found</div>';return;}
    document.getElementById('creatorList').innerHTML=creators.map(c=>`
      <div class="creator-card" onclick="window.location.href='profile.html?u=${c._id}'">
        <div class="creator-av">${(c.username||'U')[0].toUpperCase()}</div>
        <div class="creator-info">
          <h3>@${c.username}</h3>
          <p>${c.displayName||''} • ${c.videoCount||0} videos</p>
        </div>
        <button class="follow-btn ${followed.has(c._id)?'following':''}" onclick="event.stopPropagation();follow('${c._id}',this)">
          ${followed.has(c._id)?'Following':'Follow'}
        </button>
      </div>`).join('');
  }catch{document.getElementById('creatorList').innerHTML='<div class="empty">Could not load creators</div>';}
}
async function follow(id,btn){
  if(followed.has(id))return;
  try{
    await fetch(API+'/api/follows',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({followingId:id})});
    followed.add(id);localStorage.setItem('cheka_following',JSON.stringify([...followed]));
    btn.textContent='Following';btn.classList.add('following');
  }catch{}
}
load();
</script>
</body>
</html>
