<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Discover — Cheka</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100%;padding-bottom:70px}
    .top-search-bar{position:sticky;top:0;z-index:10;background:#000;padding:env(safe-area-inset-top,10px) 12px 8px}
    .search-row{display:flex;align-items:center;gap:10px}
    .search-wrap{flex:1;position:relative;display:flex;align-items:center}
    .search-wrap svg{position:absolute;left:10px;color:#888;width:18px;height:18px}
    .search-input{width:100%;background:#1c1c1e;border:none;border-radius:10px;padding:9px 12px 9px 36px;color:#fff;font-size:15px;outline:none}
    .search-input::placeholder{color:#888}
    .search-cancel{color:#fe2c55;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;display:none}
    .search-cancel.show{display:block}
    .section-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:900;padding:16px 12px 10px;color:#fff}
    /* TRENDING GRID */
    .trending-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:0 0 4px}
    .trending-card{position:relative;aspect-ratio:9/14;overflow:hidden;cursor:pointer}
    .trending-card:first-child{grid-row:span 2;aspect-ratio:auto}
    .trending-card img,.trending-card .tc-bg{width:100%;height:100%;object-fit:cover;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
    .trending-card .tc-bg{display:flex;align-items:center;justify-content:center;font-size:3rem}
    .trending-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(to top,rgba(0,0,0,.8),transparent)}
    .trending-label{position:absolute;bottom:8px;left:8px;right:8px;z-index:1}
    .trending-label .tag{font-size:13px;font-weight:700;color:#fff;display:block}
    .trending-label .views{font-size:11px;color:rgba(255,255,255,.7)}
    /* HASHTAG CHIPS */
    .hashtags-row{display:flex;gap:8px;overflow-x:auto;padding:0 12px 4px;scrollbar-width:none}
    .hashtags-row::-webkit-scrollbar{display:none}
    .htag{background:#1c1c1e;border-radius:20px;padding:6px 14px;font-size:13px;white-space:nowrap;cursor:pointer}
    .htag.active{background:#fe2c55;color:#fff}
    /* SEARCH RESULTS */
    .results{padding:0 12px;display:none}
    .results.show{display:block}
    .user-result{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #1c1c1e;cursor:pointer}
    .user-av{width:48px;height:48px;border-radius:50%;background:#fe2c55;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;font-family:'Syne',sans-serif;flex-shrink:0}
    .user-info h3{font-size:14px;font-weight:700}
    .user-info p{font-size:12px;color:#888;margin-top:2px}
    .user-follow{margin-left:auto;background:transparent;border:1px solid #fe2c55;color:#fe2c55;border-radius:4px;padding:5px 14px;font-size:13px;font-weight:700;cursor:pointer}
    /* VIDEO GRID */
    .video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
    .vg-item{position:relative;aspect-ratio:9/16;overflow:hidden;cursor:pointer;background:#111}
    .vg-item video,.vg-item .vg-thumb{width:100%;height:100%;object-fit:cover;background:linear-gradient(135deg,#1a1a1a,#2a2a2a)}
    .vg-item .vg-thumb{display:flex;align-items:center;justify-content:center;font-size:2rem}
    .vg-likes{position:absolute;bottom:4px;left:4px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
    /* BOTTOM NAV */
    .bot-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;align-items:center;padding:8px 0 env(safe-area-inset-bottom,8px);background:rgba(0,0,0,.88);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08)}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:rgba(255,255,255,.55);font-size:10px;font-weight:500;min-width:48px}
    .nav-item.active{color:#fff}
    .nav-item svg{width:26px;height:26px}
    .nav-plus-wrap{display:flex;align-items:center;justify-content:center}
    .nav-plus{background:#fff;border-radius:8px;width:42px;height:28px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#000;position:relative}
    .nav-plus::before{content:'';position:absolute;left:-5px;top:0;bottom:0;width:6px;border-radius:4px 0 0 4px;background:#25f4ee}
    .nav-plus::after{content:'';position:absolute;right:-5px;top:0;bottom:0;width:6px;border-radius:0 4px 4px 0;background:#fe2c55}
    .empty{text-align:center;padding:40px;color:#555}
    .empty h3{font-family:'Syne',sans-serif;font-size:1rem;margin-bottom:8px}
  </style>
</head>
<body>

<div class="top-search-bar">
  <div class="search-row">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" id="searchInput" type="text" placeholder="Search creators, sounds, hashtags" autocomplete="off"/>
    </div>
    <span class="search-cancel" id="cancelBtn" onclick="cancelSearch()">Cancel</span>
  </div>
</div>

<div id="discoverView">
  <div class="section-title">Trending 🔥</div>

  <div class="hashtags-row" id="hashtagsRow">
    <span class="htag active" onclick="filterTag('',this)">#AllVibes</span>
    <span class="htag" onclick="filterTag('Comedy',this)">#Comedy</span>
    <span class="htag" onclick="filterTag('Skits',this)">#Skits</span>
    <span class="htag" onclick="filterTag('Roasts',this)">#Roasts</span>
    <span class="htag" onclick="filterTag('Memes',this)">#Memes</span>
    <span class="htag" onclick="filterTag('Standup',this)">#Standup</span>
    <span class="htag" onclick="filterTag('Nairobi',this)">#Nairobi</span>
  </div>

  <div id="trendingContent">
    <div class="video-grid" id="videoGrid"></div>
  </div>
</div>

<div class="results" id="resultsView">
  <div id="userResults"></div>
  <div class="section-title" style="padding-left:0">Videos</div>
  <div class="video-grid" id="searchVideoGrid"></div>
</div>

<nav class="bot-nav">
  <a href="feed.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Home</span>
  </a>
  <a href="search.html" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <span>Discover</span>
  </a>
  <a href="upload.html" class="nav-item">
    <div class="nav-plus-wrap"><div class="nav-plus">+</div></div>
  </a>
  <a href="messages.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    <span>Inbox</span>
  </a>
  <a href="profile.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>Me</span>
  </a>
</nav>

<script>
const API = 'https://cheka-backend.onrender.com';
const token = localStorage.getItem('cheka_token');
const user = JSON.parse(localStorage.getItem('cheka_user') || '{}');
if (!token) window.location.href = 'login.html';

let allVideos = [], currentTag = '';
let searchTimer = null;

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  document.getElementById('cancelBtn').classList.toggle('show', q.length > 0);
  clearTimeout(searchTimer);
  if (!q) { showDiscover(); return; }
  searchTimer = setTimeout(() => doSearch(q), 350);
  showResults();
});

function showDiscover() {
  document.getElementById('discoverView').style.display = '';
  document.getElementById('resultsView').classList.remove('show');
}
function showResults() {
  document.getElementById('discoverView').style.display = 'none';
  document.getElementById('resultsView').classList.add('show');
}
function cancelSearch() {
  searchInput.value = '';
  document.getElementById('cancelBtn').classList.remove('show');
  showDiscover();
}

async function doSearch(q) {
  const userDiv = document.getElementById('userResults');
  const videoGrid = document.getElementById('searchVideoGrid');
  userDiv.innerHTML = '<div style="padding:12px;color:#555">Searching...</div>';
  videoGrid.innerHTML = '';
  try {
    const [uRes, vRes] = await Promise.all([
      fetch(API + '/api/users/search?q=' + encodeURIComponent(q), { headers: { Authorization: 'Bearer ' + token } }),
      fetch(API + '/api/videos?q=' + encodeURIComponent(q))
    ]);
    const users = await uRes.json().catch(() => []);
    const videos = await vRes.json().catch(() => []);

    userDiv.innerHTML = users.length
      ? users.map(u => `
        <div class="user-result" onclick="window.location.href='messages.html?dm=${u._id}&username=${u.username}'">
          <div class="user-av">${(u.username||'U')[0].toUpperCase()}</div>
          <div class="user-info">
            <h3>@${u.username}</h3>
            <p>${u.displayName || ''}</p>
          </div>
          <button class="user-follow" onclick="event.stopPropagation();this.textContent='✓';this.style.background='#25f4ee';this.style.color='#000';this.style.border='none'">Follow</button>
        </div>`).join('')
      : '';

    renderVideoGrid(videos, videoGrid);
  } catch { userDiv.innerHTML = '<div style="padding:12px;color:#555">Error searching</div>'; }
}

async function loadVideos(tag) {
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = '<div style="grid-column:1/-1;padding:40px;text-align:center;color:#555">Loading...</div>';
  try {
    const res = await fetch(API + '/api/videos' + (tag ? '?category=' + tag : ''));
    allVideos = await res.json();
    renderVideoGrid(allVideos, grid);
  } catch { grid.innerHTML = '<div style="grid-column:1/-1;padding:40px;text-align:center;color:#555">Could not load</div>'; }
}

function renderVideoGrid(videos, grid) {
  if (!videos.length) { grid.innerHTML = '<div style="grid-column:1/-1;padding:40px;text-align:center;color:#555">No videos found</div>'; return; }
  grid.innerHTML = videos.slice(0,30).map(v => `
    <div class="vg-item" onclick="window.location.href='feed.html#${v._id}'">
      ${v.videoType === 'direct' && v.videoUrl
        ? `<video src="${v.videoUrl}" muted preload="none"></video>`
        : `<div class="vg-thumb">😂</div>`
      }
      <div class="vg-likes">❤️ ${fmtNum(v.likes||0)}</div>
    </div>
  `).join('');
}

function filterTag(tag, el) {
  currentTag = tag;
  document.querySelectorAll('.htag').forEach(h => h.classList.remove('active'));
  el.classList.add('active');
  loadVideos(tag);
}

function fmtNum(n) {
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return n;
}

loadVideos('');
</script>
</body>
</html>
