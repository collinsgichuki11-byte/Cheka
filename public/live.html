<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>LIVE — Cheka</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100%;padding-bottom:80px}
    .top-bar{display:flex;align-items:center;gap:10px;padding:env(safe-area-inset-top,10px) 16px 10px;border-bottom:1px solid rgba(255,255,255,.08);background:#000;position:sticky;top:0;z-index:10}
    .top-back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
    .top-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:900;flex:1}
    .go-live-btn{background:#fe2c55;border:none;border-radius:20px;padding:7px 16px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px}
    .go-live-btn::before{content:'';width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    /* LIVE GRID */
    .live-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px}
    .live-card{position:relative;aspect-ratio:9/16;overflow:hidden;background:#111;cursor:pointer}
    .live-card .lc-bg{width:100%;height:100%;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);display:flex;align-items:center;justify-content:center;font-size:3rem}
    .live-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:55%;background:linear-gradient(to top,rgba(0,0,0,.9),transparent)}
    .live-badge{position:absolute;top:8px;left:8px;z-index:1;background:#fe2c55;border-radius:4px;padding:3px 7px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
    .live-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
    .live-viewers{position:absolute;top:8px;right:8px;z-index:1;background:rgba(0,0,0,.7);border-radius:4px;padding:3px 7px;font-size:11px;display:flex;align-items:center;gap:4px}
    .live-info{position:absolute;bottom:8px;left:8px;right:8px;z-index:1}
    .live-info .live-user{font-weight:700;font-size:13px;margin-bottom:2px}
    .live-info .live-topic{font-size:11px;color:rgba(255,255,255,.75)}
    /* GO LIVE MODAL */
    .modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:flex-end}
    .modal-bg.open{display:flex}
    .modal{background:#1a1a1a;border-radius:16px 16px 0 0;padding:20px 16px env(safe-area-inset-bottom,20px);width:100%}
    .modal-handle{width:40px;height:4px;border-radius:2px;background:#444;margin:0 auto 16px}
    .modal-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:900;margin-bottom:4px}
    .modal-sub{font-size:13px;color:#888;margin-bottom:20px}
    .modal-field{background:#2a2a2a;border:none;border-radius:10px;padding:12px 14px;color:#fff;font-size:14px;width:100%;margin-bottom:12px;outline:none}
    .modal-field:focus{outline:1px solid #fe2c55}
    .modal-btn{width:100%;background:#fe2c55;border:none;border-radius:10px;padding:14px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
    /* SECTION */
    .section-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:900;padding:14px 16px 10px;display:flex;align-items:center;gap:8px}
    .section-title .live-dot{width:8px;height:8px;border-radius:50%;background:#fe2c55;animation:pulse 1s infinite}
    /* FOLLOW ROW */
    .follow-lives{display:flex;gap:12px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
    .follow-lives::-webkit-scrollbar{display:none}
    .fl-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0}
    .fl-av{width:64px;height:64px;border-radius:50%;background:#fe2c55;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;position:relative;border:2px solid #fe2c55}
    .fl-av .live-ring{position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;border-radius:50%;border:3px solid #fe2c55;animation:ringPulse 1.5s infinite}
    @keyframes ringPulse{0%{transform:scale(1);opacity:1}100%{transform:scale(1.2);opacity:0}}
    .fl-name{font-size:11px;color:#ccc;text-align:center;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* EMPTY */
    .empty{text-align:center;padding:48px 24px;color:#555}
    .empty h3{font-family:'Syne',sans-serif;font-size:1rem;color:#888;margin-bottom:8px}
    /* BOTTOM NAV */
    .bot-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;align-items:center;padding:8px 0 env(safe-area-inset-bottom,8px);background:rgba(0,0,0,.95);border-top:1px solid rgba(255,255,255,.08)}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:rgba(255,255,255,.55);font-size:10px;min-width:48px}
    .nav-item.active{color:#fff}
    .nav-item svg{width:26px;height:26px}
    .nav-plus-wrap{display:flex;align-items:center}
    .nav-plus{background:#fff;border-radius:8px;width:42px;height:28px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#000;position:relative}
    .nav-plus::before{content:'';position:absolute;left:-5px;top:0;bottom:0;width:6px;border-radius:4px 0 0 4px;background:#25f4ee}
    .nav-plus::after{content:'';position:absolute;right:-5px;top:0;bottom:0;width:6px;border-radius:0 4px 4px 0;background:#fe2c55}
    .toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.12);backdrop-filter:blur(8px);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:999;white-space:nowrap;display:none}
    .toast.show{display:block}
  </style>
</head>
<body>

<div class="top-bar">
  <button class="top-back" onclick="history.back()">‹</button>
  <span class="top-title">🔴 LIVE</span>
  <button class="go-live-btn" onclick="openGoLive()">Go LIVE</button>
</div>

<!-- FOLLOWED GOING LIVE -->
<div class="section-title"><div class="live-dot"></div> Following going live</div>
<div class="follow-lives" id="followLives">
  <div style="padding:8px;color:#555;font-size:13px">Loading...</div>
</div>

<!-- ALL LIVE STREAMS -->
<div class="section-title"><div class="live-dot"></div> Live now</div>
<div class="live-grid" id="liveGrid">
  <div style="grid-column:1/-1;padding:40px;text-align:center;color:#555">Loading streams...</div>
</div>

<!-- GO LIVE MODAL -->
<div class="modal-bg" id="modalBg" onclick="event.target===this&&closeGoLive()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Go LIVE 🔴</div>
    <div class="modal-sub">Start a live stream on Cheka</div>
    <input class="modal-field" id="liveTitle" placeholder="Stream title e.g. 'Comedy Q&A'" maxlength="80"/>
    <input class="modal-field" id="liveStreamUrl" placeholder="Your stream URL (YouTube Live, etc.)" type="url"/>
    <button class="modal-btn" onclick="startLive()">🔴 Start Live Now</button>
  </div>
</div>

<nav class="bot-nav">
  <a href="feed.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Home</span>
  </a>
  <a href="search.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <span>Discover</span>
  </a>
  <a href="upload.html" class="nav-item">
    <div class="nav-plus-wrap"><div class="nav-plus">+</div></div>
  </a>
  <a href="messages.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    <span>Inbox</span>
  </a>
  <a href="profile.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>Me</span>
  </a>
</nav>
<div class="toast" id="toast"></div>

<script>
const API = 'https://cheka-backend.onrender.com';
const token = localStorage.getItem('cheka_token');
const user = JSON.parse(localStorage.getItem('cheka_user') || '{}');
if (!token) window.location.href = 'login.html';

const emojiBgs = ['🎭','🎤','😂','🔥','🎸','🤣','😎','🎬'];

async function loadLiveStreams() {
  try {
    const res = await fetch(API + '/api/live', { headers: { Authorization: 'Bearer ' + token } });
    const streams = await res.json();
    if (!streams.length) {
      document.getElementById('liveGrid').innerHTML = '<div class="empty" style="grid-column:1/-1"><h3>No live streams right now</h3><p>Be the first to go live!</p></div>';
      document.getElementById('followLives').innerHTML = '<div style="padding:8px;color:#555;font-size:13px">No one you follow is live</div>';
      return;
    }
    document.getElementById('followLives').innerHTML = streams.slice(0, 5).map((s, i) => `
      <div class="fl-item" onclick="watchLive('${s.streamUrl || ''}','${s.title || ''}')">
        <div class="fl-av">
          <div class="live-ring"></div>
          ${(s.username || 'C')[0].toUpperCase()}
        </div>
        <div class="fl-name">@${s.username || 'creator'}</div>
      </div>
    `).join('');
    document.getElementById('liveGrid').innerHTML = streams.map((s, i) => `
      <div class="live-card" onclick="watchLive('${s.streamUrl || ''}','${s.title || ''}')">
        <div class="lc-bg">${emojiBgs[i % emojiBgs.length]}</div>
        <div class="live-badge">LIVE</div>
        <div class="live-viewers">👁 ${fmtNum(s.viewerCount || Math.floor(Math.random()*500)+50)}</div>
        <div class="live-info">
          <div class="live-user">@${s.username || 'creator'}</div>
          <div class="live-topic">${s.title || 'Live stream'}</div>
        </div>
      </div>
    `).join('');
  } catch {
    document.getElementById('liveGrid').innerHTML = '<div class="empty" style="grid-column:1/-1"><h3>Could not load streams</h3></div>';
    document.getElementById('followLives').innerHTML = '<div style="padding:8px;color:#555;font-size:13px">Could not load</div>';
  }
}

function watchLive(url, title) {
  if (!url) { toast('Stream link unavailable'); return; }
  if (url.includes('youtube') || url.includes('youtu.be')) {
    const match = url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
    if (match) { window.open('https://www.youtube.com/watch?v=' + match[1], '_blank'); return; }
  }
  window.open(url, '_blank');
}

function openGoLive() { document.getElementById('modalBg').classList.add('open'); }
function closeGoLive() { document.getElementById('modalBg').classList.remove('open'); }

async function startLive() {
  const title = document.getElementById('liveTitle').value.trim();
  const streamUrl = document.getElementById('liveStreamUrl').value.trim();
  if (!title) { toast('Add a title'); return; }
  try {
    await fetch(API + '/api/live/start', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ title, streamUrl, username: user.username }) });
    closeGoLive(); toast('You\'re LIVE! 🔴'); loadLiveStreams();
  } catch { toast('Could not start stream'); }
}

function fmtNum(n) { if (n >= 1000) return (n / 1000).toFixed(1) + 'K'; return n; }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }

loadLiveStreams();
</script>
</body>
</html>
