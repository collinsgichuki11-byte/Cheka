<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Live — Cheka</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&family=Space+Mono&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{background:#000;color:#f5f5f5;font-family:'Space Mono',monospace;min-height:100%}
    .top-bar{position:sticky;top:0;z-index:100;background:#0a0a0a;border-bottom:1px solid #1f1f1f;display:flex;align-items:center;gap:1rem;padding:.85rem 1rem}
    .top-bar h1{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:900;flex:1}
    .go-live-btn{background:#e63212;border:none;color:#fff;border-radius:8px;padding:.5rem 1rem;font-family:'Space Mono',monospace;font-size:.8rem;font-weight:700;cursor:pointer;touch-action:manipulation}
    .page{padding:1rem;padding-bottom:5rem}
    .section-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:900;margin:1rem 0 .75rem;display:flex;align-items:center;gap:.5rem}
    .live-card{background:#111;border:1px solid #1f1f1f;border-radius:12px;padding:1rem;margin-bottom:.75rem;cursor:pointer;display:flex;align-items:center;gap:.85rem;touch-action:manipulation;position:relative}
    .live-card:active{background:#1a1a1a}
    .live-avatar{width:48px;height:48px;border-radius:50%;background:#e63212;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:900;font-size:1.2rem;flex-shrink:0;position:relative}
    .live-badge{position:absolute;bottom:-4px;right:-4px;background:#e63212;color:#fff;border-radius:4px;font-size:.55rem;font-weight:700;padding:1px 4px;border:2px solid #111}
    .live-info{flex:1;min-width:0}
    .live-title{font-size:.85rem;font-weight:700;margin-bottom:.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .live-meta{color:#888;font-size:.75rem}
    .live-viewers{color:#e63212;font-size:.75rem;font-weight:700}
    .empty{text-align:center;padding:2.5rem 1rem;color:#888}
    .empty h2{font-family:'Syne',sans-serif;color:#f5f5f5;margin-bottom:.5rem}
    /* GO LIVE MODAL */
    .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:3000;padding:1.5rem}
    .modal-overlay.active{display:flex}
    .modal{background:#111;border:1px solid #2a2a2a;border-radius:16px;padding:2rem;width:100%;max-width:420px}
    .modal h2{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:900;margin-bottom:1.5rem}
    .fg{margin-bottom:1.2rem}
    .fg label{display:block;font-size:.8rem;color:#888;margin-bottom:.4rem}
    .fg input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:.8rem 1rem;color:#f5f5f5;font-family:'Space Mono',monospace;font-size:.85rem;outline:none}
    .fg input:focus{border-color:#e63212}
    .modal-btns{display:flex;gap:1rem}
    .btn-cancel{background:transparent;color:#888;border:1px solid #2a2a2a;border-radius:8px;padding:.8rem 1.2rem;font-family:'Space Mono',monospace;cursor:pointer}
    .btn-start{flex:1;background:#e63212;color:#fff;border:none;border-radius:8px;padding:.8rem;font-family:'Space Mono',monospace;font-weight:700;cursor:pointer}
    .err{background:rgba(230,50,18,.1);border:1px solid rgba(230,50,18,.3);color:#e63212;padding:.7rem 1rem;border-radius:8px;font-size:.8rem;margin-bottom:1rem;display:none}
    /* VIEWER */
    .viewer{display:none;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;z-index:400;background:#000}
    .viewer.open{display:flex}
    .viewer-header{background:rgba(0,0,0,.7);position:absolute;top:0;left:0;right:0;z-index:10;padding:.85rem 1rem;display:flex;align-items:center;gap:.75rem}
    .viewer-back{background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer}
    .viewer-title{font-family:'Syne',sans-serif;font-weight:900;font-size:.95rem;flex:1}
    .live-pill{background:#e63212;color:#fff;border-radius:4px;font-size:.65rem;font-weight:700;padding:2px 6px}
    .viewer-body{flex:1;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#888;font-size:.85rem;text-align:center;padding:2rem}
    .viewer-footer{background:rgba(0,0,0,.7);position:absolute;bottom:0;left:0;right:0;padding:.75rem 1rem;display:flex;align-items:center;gap:.75rem}
    .heart-btn{background:none;border:none;font-size:1.8rem;cursor:pointer;touch-action:manipulation}
    .heart-count{color:#e63212;font-size:.85rem;font-weight:700}
    .viewer-info{flex:1;min-width:0}
    .viewer-broadcaster{font-size:.8rem;color:#1db954}
    .viewer-viewers{font-size:.7rem;color:#888}
    .bot-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;justify-content:space-around;align-items:center;padding:.6rem 1rem env(safe-area-inset-bottom,.4rem);background:#0a0a0a;border-top:1px solid #1f1f1f}
    .bot-btn{display:flex;flex-direction:column;align-items:center;gap:.2rem;text-decoration:none;color:rgba(255,255,255,.5);font-size:.55rem;touch-action:manipulation}
    .bot-btn.active{color:#f5f5f5}
    .bot-btn .bicon{font-size:1.3rem}
    .toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:#1db954;color:#000;padding:.65rem 1.4rem;border-radius:8px;font-size:.8rem;font-weight:700;display:none;z-index:9999;white-space:nowrap}
    .toast.show{display:block}
    .loader{text-align:center;padding:2rem;color:#888;font-size:.8rem}
  </style>
</head>
<body>

<div class="top-bar">
  <h1>🔴 Live</h1>
  <button class="go-live-btn" onclick="openGoLive()">Go Live</button>
</div>

<div class="page">
  <div class="section-title">🔥 Live Now</div>
  <div id="liveNow"><div class="loader">Loading...</div></div>

  <div class="section-title" id="followedTitle" style="display:none">❤️ People You Follow</div>
  <div id="followedLive"></div>
</div>

<!-- Go Live Modal -->
<div class="modal-overlay" id="goLiveModal">
  <div class="modal">
    <h2>🔴 Start Your Live</h2>
    <div class="err" id="goLiveErr"></div>
    <div class="fg">
      <label>Stream Title</label>
      <input type="text" id="streamTitle" placeholder="e.g. Comedy Night with Collins 😂" maxlength="120"/>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeGoLive()">Cancel</button>
      <button class="btn-start" onclick="startLive()">🔴 Go Live</button>
    </div>
  </div>
</div>

<!-- Viewer -->
<div class="viewer" id="viewer">
  <div class="viewer-header">
    <button class="viewer-back" onclick="closeViewer()">←</button>
    <div class="viewer-title" id="viewerTitle"></div>
    <span class="live-pill">LIVE</span>
  </div>
  <div class="viewer-body" id="viewerBody">
    <div>
      <p style="font-size:3rem">📺</p>
      <p style="margin-top:.5rem;font-family:'Syne',sans-serif;font-weight:900">Watching Live</p>
      <p style="margin-top:.5rem;font-size:.75rem;color:#666">Video streaming coming soon.<br/>For now you can send hearts! ❤️</p>
    </div>
  </div>
  <div class="viewer-footer">
    <div class="viewer-info">
      <div class="viewer-broadcaster" id="viewerBroadcaster"></div>
      <div class="viewer-viewers" id="viewerViewers"></div>
    </div>
    <button class="heart-btn" id="heartBtn" onclick="sendHeart()">❤️</button>
    <span class="heart-count" id="heartCount">0</span>
  </div>
</div>

<div class="bot-bar">
  <a href="index.html" class="bot-btn"><span class="bicon">🏠</span><span>Home</span></a>
  <a href="feed.html" class="bot-btn"><span class="bicon">😂</span><span>Watch</span></a>
  <a href="upload.html" class="bot-btn"><span class="bicon">➕</span><span>Upload</span></a>
  <a href="messages.html" class="bot-btn"><span class="bicon">💬</span><span>DMs</span></a>
  <a href="profile.html" class="bot-btn"><span class="bicon">👤</span><span>Me</span></a>
</div>

<div class="toast" id="toast"></div>

<script>
const API='https://cheka-backend.onrender.com';
const token=localStorage.getItem('cheka_token');
const user=JSON.parse(localStorage.getItem('cheka_user')||'{}');
if(!token)window.location.href='login.html';

let activeStreamId=null;

function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

async function loadLive(){
  try{
    const res=await fetch(API+'/api/live/active',{headers:{'Authorization':'Bearer '+token}});
    const data=await res.json();
    const box=document.getElementById('liveNow');
    const all=[...(data.followed||[]),...(data.trending||[])];

    if(data.followed&&data.followed.length){
      document.getElementById('followedTitle').style.display='flex';
      document.getElementById('followedLive').innerHTML=data.followed.map(streamCard).join('');
    }

    const trending=data.trending||[];
    if(!trending.length&&!((data.followed||[]).length)){
      box.innerHTML=`<div class="empty"><p style="font-size:2.5rem">😴</p><h2>Nobody is live right now</h2><p>Be the first — tap "Go Live" above!</p></div>`;
      return;
    }
    box.innerHTML=trending.length?trending.map(streamCard).join(''):'<div class="loader" style="color:#555">No other streams right now</div>';
  }catch{
    document.getElementById('liveNow').innerHTML='<div class="loader">Could not load live streams</div>';
  }
}

function streamCard(s){
  return `<div class="live-card" onclick="watchStream('${s._id}','${escHtml(s.title||'Live Stream')}','${escHtml(s.broadcasterName||'')}',${s.viewerCount||0},${s.heartCount||0})">
    <div class="live-avatar">${s.broadcasterName?s.broadcasterName[0].toUpperCase():'?'}<span class="live-badge">LIVE</span></div>
    <div class="live-info">
      <div class="live-title">${escHtml(s.title||'Live Stream')}</div>
      <div class="live-meta">@${escHtml(s.broadcasterName||'')} &nbsp;❤️ ${s.heartCount||0}</div>
    </div>
    <div class="live-viewers">👁 ${s.viewerCount||0}</div>
  </div>`;
}

function watchStream(id,title,broadcaster,viewers,hearts){
  activeStreamId=id;
  document.getElementById('viewerTitle').textContent=title;
  document.getElementById('viewerBroadcaster').textContent='@'+broadcaster;
  document.getElementById('viewerViewers').textContent=viewers+' watching';
  document.getElementById('heartCount').textContent=hearts;
  document.getElementById('viewer').classList.add('open');
}

function closeViewer(){
  document.getElementById('viewer').classList.remove('open');
  activeStreamId=null;
}

async function sendHeart(){
  if(!activeStreamId)return;
  const btn=document.getElementById('heartBtn');
  btn.style.transform='scale(1.4)';setTimeout(()=>btn.style.transform='',200);
  try{
    const res=await fetch(API+'/api/live/'+activeStreamId+'/heart',{method:'POST',headers:{'Authorization':'Bearer '+token}});
    const d=await res.json();
    document.getElementById('heartCount').textContent=d.heartCount||0;
  }catch{}
}

function openGoLive(){
  if(!token){toast('Login to go live');return;}
  document.getElementById('goLiveModal').classList.add('active');
  document.getElementById('streamTitle').focus();
}
function closeGoLive(){
  document.getElementById('goLiveModal').classList.remove('active');
  document.getElementById('goLiveErr').style.display='none';
}

async function startLive(){
  const title=document.getElementById('streamTitle').value.trim();
  const err=document.getElementById('goLiveErr');
  err.style.display='none';
  if(!title){err.textContent='Give your stream a title!';err.style.display='block';return;}
  try{
    const res=await fetch(API+'/api/live',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({title})
    });
    const d=await res.json();
    if(!res.ok){err.textContent=d.msg||'Could not start stream';err.style.display='block';return;}
    closeGoLive();
    toast('You are now live! 🔴');
    watchStream(d._id,d.title||'My Live',user.username||'',0,0);
    loadLive();
  }catch{err.textContent='Network error';err.style.display='block';}
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

loadLive();
setInterval(loadLive,30000);
</script>
</body>
</html>
