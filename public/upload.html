<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Create — Cheka</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100%}
    .top-bar{display:flex;align-items:center;padding:env(safe-area-inset-top,10px) 16px 10px;border-bottom:1px solid rgba(255,255,255,.08);gap:10px}
    .top-close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:4px}
    .top-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:900;flex:1;text-align:center}
    .top-post{background:none;border:none;color:#fe2c55;font-size:15px;font-weight:700;cursor:pointer;padding:4px}
    /* VIDEO PREVIEW AREA */
    .preview-zone{margin:16px;border-radius:12px;overflow:hidden;background:#111;aspect-ratio:9/16;max-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:2px dashed rgba(255,255,255,.15);position:relative;transition:border-color .2s}
    .preview-zone.has-content{border-color:transparent}
    .preview-zone:hover{border-color:rgba(254,44,85,.5)}
    .preview-zone .pz-icon{font-size:3rem;margin-bottom:8px}
    .preview-zone .pz-text{font-size:14px;color:#888;text-align:center;padding:0 20px}
    .preview-zone .pz-sub{font-size:12px;color:#555;margin-top:4px;text-align:center}
    .preview-zone video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:none}
    .preview-zone.has-content video{display:block}
    .preview-zone .remove-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);border:none;border-radius:50%;width:28px;height:28px;color:#fff;font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center}
    .preview-zone.has-content .remove-btn{display:flex}
    /* OR DIVIDER */
    .or-divider{display:flex;align-items:center;gap:10px;margin:0 16px 16px;color:#444;font-size:12px}
    .or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:#222}
    /* FORM */
    .form-section{padding:0 16px;padding-bottom:100px}
    .field-row{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06)}
    .field-label{font-size:14px;color:#888;width:80px;flex-shrink:0}
    .field-input{flex:1;background:none;border:none;color:#fff;font-size:14px;outline:none}
    .field-input::placeholder{color:#555}
    .field-textarea{flex:1;background:none;border:none;color:#fff;font-size:14px;outline:none;resize:none;min-height:60px;line-height:1.5}
    .field-textarea::placeholder{color:#555}
    .field-select{flex:1;background:none;border:none;color:#fff;font-size:14px;outline:none;appearance:none;cursor:pointer}
    .field-select option{background:#1a1a1a;color:#fff}
    .field-arrow{color:#555;font-size:16px}
    /* YOUTUBE OPTION */
    .yt-section{background:#111;border-radius:12px;margin:0 16px 16px;padding:14px}
    .yt-title{font-size:13px;color:#888;margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .yt-title .yt-icon{color:#fe2c55}
    .yt-input-row{display:flex;gap:8px;align-items:center}
    .yt-input{flex:1;background:#1c1c1e;border:none;border-radius:8px;padding:10px 12px;color:#fff;font-size:14px;outline:none}
    .yt-input:focus{outline:1px solid #fe2c55}
    .yt-check-btn{background:#fe2c55;border:none;border-radius:8px;padding:10px 14px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
    .yt-preview{margin-top:10px;border-radius:8px;overflow:hidden;display:none}
    .yt-preview iframe{width:100%;aspect-ratio:16/9;border:none}
    /* POST BUTTON */
    .post-btn-fixed{position:fixed;bottom:0;left:0;right:0;padding:12px 16px env(safe-area-inset-bottom,12px);background:#000;border-top:1px solid rgba(255,255,255,.08)}
    .post-btn{width:100%;background:#fe2c55;border:none;border-radius:8px;padding:14px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:'Syne',sans-serif;transition:opacity .2s}
    .post-btn:disabled{opacity:.5;cursor:not-allowed}
    /* HIDDEN FILE INPUT */
    #fileInput{display:none}
    .toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.12);backdrop-filter:blur(8px);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:999;white-space:nowrap;display:none}
    .toast.show{display:block}
  </style>
</head>
<body>

<div class="top-bar">
  <button class="top-close" onclick="window.location.href='feed.html'">✕</button>
  <span class="top-title">New Video</span>
  <button class="top-post" onclick="postVideo()">Post</button>
</div>

<!-- VIDEO UPLOAD ZONE -->
<div class="preview-zone" id="previewZone" onclick="triggerUpload()">
  <div class="pz-icon">📹</div>
  <div class="pz-text">Tap to upload a video</div>
  <div class="pz-sub">MP4, MOV, WebM • Max 200MB</div>
  <video id="videoPreview" muted playsinline controls></video>
  <button class="remove-btn" onclick="event.stopPropagation();clearFile()">✕</button>
</div>

<input type="file" id="fileInput" accept="video/*" onchange="handleFile(this.files[0])"/>

<!-- OR DIVIDER -->
<div class="or-divider">OR</div>

<!-- YOUTUBE LINK -->
<div class="yt-section">
  <div class="yt-title"><span class="yt-icon">▶</span> Paste a YouTube link instead</div>
  <div class="yt-input-row">
    <input class="yt-input" id="ytInput" type="text" placeholder="https://youtube.com/watch?v=..." oninput="ytChanged()"/>
    <button class="yt-check-btn" onclick="checkYT()">Preview</button>
  </div>
  <div class="yt-preview" id="ytPreview">
    <iframe id="ytFrame" allowfullscreen></iframe>
  </div>
</div>

<!-- FORM FIELDS -->
<div class="form-section">
  <div class="field-row">
    <span class="field-label">Title</span>
    <input class="field-input" id="titleInput" placeholder="Describe your video..." maxlength="100"/>
  </div>
  <div class="field-row">
    <span class="field-label">Caption</span>
    <textarea class="field-textarea" id="descInput" placeholder="Add a caption, tag people, add hashtags #cheka" maxlength="300"></textarea>
  </div>
  <div class="field-row">
    <span class="field-label">Category</span>
    <select class="field-select" id="catInput">
      <option value="Comedy">😂 Comedy</option>
      <option value="Skits">🎭 Skits</option>
      <option value="Memes">🤣 Memes</option>
      <option value="Roasts">🔥 Roasts</option>
      <option value="Standup">🎤 Standup</option>
      <option value="Other">Other</option>
    </select>
    <span class="field-arrow">›</span>
  </div>
  <div class="field-row">
    <span class="field-label">Sound</span>
    <input class="field-input" id="soundInput" placeholder="Original sound or song name"/>
  </div>
  <div class="field-row">
    <span class="field-label">Privacy</span>
    <select class="field-select" id="privacyInput">
      <option value="everyone">Everyone</option>
      <option value="followers">Followers only</option>
      <option value="private">Only me</option>
    </select>
    <span class="field-arrow">›</span>
  </div>
</div>

<div class="post-btn-fixed">
  <button class="post-btn" id="postBtn" onclick="postVideo()">Post</button>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://cheka-backend.onrender.com';
const token = localStorage.getItem('cheka_token');
const user = JSON.parse(localStorage.getItem('cheka_user') || '{}');
if (!token) window.location.href = 'login.html';

let selectedFile = null, ytVideoId = null;

function triggerUpload() {
  if (!document.getElementById('previewZone').classList.contains('has-content')) {
    document.getElementById('fileInput').click();
  }
}

function handleFile(file) {
  if (!file) return;
  selectedFile = file;
  ytVideoId = null;
  document.getElementById('ytInput').value = '';
  document.getElementById('ytPreview').style.display = 'none';
  const url = URL.createObjectURL(file);
  const vid = document.getElementById('videoPreview');
  vid.src = url;
  document.getElementById('previewZone').classList.add('has-content');
}

function clearFile() {
  selectedFile = null;
  document.getElementById('videoPreview').src = '';
  document.getElementById('previewZone').classList.remove('has-content');
  document.getElementById('fileInput').value = '';
}

function ytChanged() {
  if (!document.getElementById('ytInput').value.trim()) {
    document.getElementById('ytPreview').style.display = 'none';
    ytVideoId = null;
  }
}

function checkYT() {
  const url = document.getElementById('ytInput').value.trim();
  const match = url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
  if (!match) { toast('Not a valid YouTube URL'); return; }
  ytVideoId = match[1];
  clearFile();
  document.getElementById('ytFrame').src = 'https://www.youtube.com/embed/' + ytVideoId;
  document.getElementById('ytPreview').style.display = 'block';
  toast('YouTube video ready!');
}

async function postVideo() {
  const title = document.getElementById('titleInput').value.trim();
  const description = document.getElementById('descInput').value.trim();
  const category = document.getElementById('catInput').value;
  const music = document.getElementById('soundInput').value.trim();
  const privacy = document.getElementById('privacyInput').value;

  if (!title) { toast('Add a title first!'); return; }
  if (!selectedFile && !ytVideoId) { toast('Upload a video or add a YouTube link!'); return; }

  const btn = document.getElementById('postBtn');
  btn.disabled = true;
  btn.textContent = 'Posting...';

  try {
    let body, headers = { Authorization: 'Bearer ' + token };

    if (selectedFile) {
      const fd = new FormData();
      fd.append('video', selectedFile);
      fd.append('title', title);
      fd.append('description', description);
      fd.append('category', category);
      if (music) fd.append('music', music);
      fd.append('privacy', privacy);
      fd.append('creatorName', user.username);
      fd.append('videoType', 'direct');
      body = fd;
    } else {
      headers['Content-Type'] = 'application/json';
      body = JSON.stringify({ title, description, category, music, privacy, youtubeId: ytVideoId, creatorName: user.username, videoType: 'youtube' });
    }

    const res = await fetch(API + '/api/videos', { method: 'POST', headers, body });
    const data = await res.json();

    if (!res.ok) { toast(data.msg || 'Upload failed — try again'); btn.disabled = false; btn.textContent = 'Post'; return; }

    toast('Posted! 🎉');
    setTimeout(() => window.location.href = 'feed.html', 1500);
  } catch (e) {
    toast('Network error — check connection');
    btn.disabled = false;
    btn.textContent = 'Post';
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
