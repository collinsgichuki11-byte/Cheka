name: Generate Release Keystore (Run Once)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias (e.g. cheka-key)'
        required: true
        default: 'cheka-key'
      store_password:
        description: 'Keystore password (save this — you will need it)'
        required: true
      key_password:
        description: 'Key password (save this — you will need it)'
        required: true
      dname:
        description: 'Distinguished name e.g. CN=Cheka,O=Cheka,C=KE'
        required: true
        default: 'CN=Cheka,O=Cheka,C=KE'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -keystore cheka-release.keystore \
            -storepass "${{ github.event.inputs.store_password }}" \
            -dname "${{ github.event.inputs.dname }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Print base64 of keystore
        run: |
          echo "=========================================="
          echo "COPY the base64 below and save it as a"
          echo "GitHub Secret named: KEYSTORE_BASE64"
          echo "=========================================="
          base64 cheka-release.keystore
          echo "=========================================="
          echo "Also save these as GitHub Secrets:"
          echo "  KEY_ALIAS    = ${{ github.event.inputs.key_alias }}"
          echo "  KEYSTORE_PASSWORD = (the store_password you entered)"
          echo "  KEY_PASSWORD = (the key_password you entered)"
          echo "=========================================="
          echo "Go to: GitHub repo → Settings → Secrets and variables → Actions"
